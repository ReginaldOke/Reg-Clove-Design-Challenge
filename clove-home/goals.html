<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Clove - Health goals</title>
<link rel="stylesheet" href="base.css" />
<script src="frame.js"></script>
<link rel="stylesheet" href="memory.css" />
<link rel="stylesheet" href="goals.css" />
<link rel="stylesheet" href="goals2.css" />
<link rel="stylesheet" href="concepts.css" />
</head>
<body class="goals goals2 c1">
<div class="phone">

  <nav class="gl-nav">
    <button class="gl-nav__back" aria-label="Back" onclick="if(history.length>1){history.back()}else{location.href='index.html'}"><img src="assets/icons/chevron-rt.svg" alt="" /></button>
  </nav>

  <main class="gl-body" id="glBody">
    <div class="gl-title-row">
      <h1 class="gl-title">Health goals</h1>
      <span class="gl-count" id="glCount">3</span>
    </div>

    <!-- the plate IS the chart: a dressed plate per goal, swipe between them -->
    <section class="pcard g2-hero" id="g2Hero">
      <div class="g2-carousel" id="g2Car"></div>
      <div class="g2-hero__meta">
        <p class="g2-hero__lbl" id="g2Lbl">Iron goal</p>
        <p class="g2-hero__pct" id="g2Pct">0%</p>
      </div>
      <div class="g2-dots" id="g2Dots"></div>
    </section>

    <!-- everything below follows the plate you swiped to -->
    <div class="g2-below" id="g2Below">

      <section class="g2-goal">
        <p class="g2-goalline" id="g2GoalLine">Goal: Eat 5 iron-rich meals</p>
        <div class="g2-meals" id="g2Meals"></div>
      </section>

      <section class="gl-week" id="glWeek">
        <div class="gl-week__head"><span class="g2-week-lbl" id="g2WeekLbl">Iron this week</span><span class="gl-week__tot"><b id="glWeekTot">0</b> of <span id="glWeekGoal">0</span></span></div>
        <svg viewBox="0 0 320 108" preserveAspectRatio="none" id="glChart"></svg>
        <div class="gl-week__days"><span>M</span><span>T</span><span>W</span><span class="today">T</span><span>F</span><span>S</span><span>S</span></div>
      </section>

      <div class="gl-plan" id="glPlanWrap">
        <button class="ai-card" id="glPlan">
          <span class="ai-card__clove"><span class="mark"><img class="logo" src="assets/icons/clove-white.svg" alt="" /><img class="spark" src="assets/icons/clove-sparkle.svg" alt="" /></span></span>
          <span class="ai-card__text">
            <span class="t" id="glPlanT">Plan meals to hit your iron goal</span>
            <span class="s" id="glPlanS">Health goal: Iron</span>
          </span>
        </button>
      </div>

    </div>
  </main>

  <!-- recipe picker (CardRecipe, Figma 28275:52775) -->
  <div class="gl-sheet g2-recipes" id="g2Modal" hidden>
    <div class="gl-sheet__scrim" id="g2ModalScrim"></div>
    <div class="gl-sheet__card">
      <div class="gl-sheet__grab"></div>
      <h2 class="gl-sheet__h" id="g2ModalH">Iron-rich dinners</h2>
      <p class="gl-sheet__s" id="g2ModalS">Tap a dinner to add it to your week.</p>
      <div class="g2-rgrid" id="g2Rgrid"></div>
    </div>
  </div>

  <!-- "What are you working on?" -->
  <div class="gl-sheet" id="glSheet" hidden>
    <div class="gl-sheet__scrim" id="glScrim"></div>
    <div class="gl-sheet__card">
      <div class="gl-sheet__grab"></div>
      <h2 class="gl-sheet__h">What are you working on?</h2>
      <p class="gl-sheet__s">Clove shapes every suggestion around this.</p>
      <div class="gl-opts" id="glOpts"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script src="memory.js"></script>
<script src="goals.js"></script>
<script src="plates.js"></script>
<script src="tracker.js"></script>
<script>
  (function () {
    var G = CloveGoals, T = Tracker;
    var TOTAL = T.TOTAL, PITCH = 185; /* slide 152 + gap 33 */
    var active = 0;
    T.cur = function () { return T.slides()[active]; };

    /* ---- hero carousel: an illustrated plate per goal ---- */
    function setMeta(i, animatePct) {
      var s = T.slides()[i];
      document.getElementById("g2Lbl").textContent = s.label + " goal";
      var pctEl = document.getElementById("g2Pct");
      var target = Math.round(s.pct * 100);
      clearInterval(pctEl._iv);
      if (animatePct) {
        var t0 = Date.now();
        pctEl._iv = setInterval(function () {
          var k = Math.min(1, (Date.now() - t0) / 1100); k = 1 - Math.pow(1 - k, 3);
          pctEl.textContent = Math.round(target * k) + "%";
          if (k >= 1) clearInterval(pctEl._iv);
        }, 16);
      } else pctEl.textContent = target + "%";
      document.querySelectorAll("#g2Dots i").forEach(function (d, j) { d.classList.toggle("on", j === i); });
    }
    function renderHero(animate) {
      var car = document.getElementById("g2Car");
      car.innerHTML = T.slides().map(function (s) {
        return '<div class="g2-slide"><div class="plate-chart">' +
          '<img src="' + (ClovePlates.IMG[s.label] || ClovePlates.IMG.Iron) + '" alt="" />' +
          ClovePlates.lipRing(s.pct, s.color, s.track, animate) +
          "</div></div>";
      }).join("");
      document.getElementById("g2Dots").innerHTML = T.slides().map(function () { return "<i></i>"; }).join("");
      active = Math.max(0, Math.min(T.slides().length - 1, Math.round(car.scrollLeft / PITCH)));
      markActive();
      setMeta(active, animate && active === 0);
      if (animate) setTimeout(function () { G.playRings(car); }, 150);
    }
    function easeActiveRing() {
      var slide = document.querySelectorAll("#g2Car .g2-slide")[active];
      var arc = slide && slide.querySelector(".gl-ring__arc");
      if (!arc) return;
      var C = 2 * Math.PI * parseFloat(arc.getAttribute("r"));
      arc.style.transition = "stroke-dasharray 900ms cubic-bezier(.25,1,.35,1)";
      arc.setAttribute("stroke-dasharray", (T.cur().pct * C).toFixed(1) + " " + C.toFixed(1));
    }
    /* the plate grows and glows when a meal is ticked off */
    function pulsePlate() {
      var chart = document.querySelectorAll("#g2Car .plate-chart")[active];
      if (!chart) return;
      chart.style.setProperty("--glow", T.cur().color);
      chart.classList.remove("tickp");
      void chart.offsetWidth;
      chart.classList.add("tickp");
    }
    function markActive() {
      document.querySelectorAll("#g2Car .g2-slide").forEach(function (sl, k) {
        sl.classList.toggle("on", k === active);
      });
    }
    document.getElementById("g2Car").addEventListener("scroll", function () {
      var i = Math.max(0, Math.min(T.slides().length - 1, Math.round(this.scrollLeft / PITCH)));
      if (i === active) return;
      active = i;
      markActive();
      setMeta(i, false);
      var below = document.getElementById("g2Below");
      below.classList.add("g2-below--fade");
      clearTimeout(below._t);
      below._t = setTimeout(function () {
        renderBelow(false);
        below.classList.remove("g2-below--fade");
      }, 150);
    }, { passive: true });

    /* ---- meal circles ---- */
    function renderMeals(popIdx) {
      var s = T.cur();
      document.getElementById("g2GoalLine").textContent = "Goal: Eat " + TOTAL + " " + T.metaFor(s.label).flavor + " meals";
      document.getElementById("g2Meals").innerHTML = T.slotsFor(s.label).map(function (m, i) {
        if (!m) return '<button class="g2-meal g2-meal--empty" data-i="' + i + '" aria-label="Add a dinner"></button>';
        return '<button class="g2-meal' + (m.done ? " done" : " g2-meal--planned") + (i === popIdx ? " g2-meal--in" : "") + '" data-i="' + i + '" aria-label="' + m.t + '">' +
          '<img src="' + m.img + '" alt="" />' +
          (m.done
            ? '<span class="g2-meal__badge" style="background:' + s.color + '"><img src="assets/icons/check-sm.svg" alt="" /></span>'
            : '<span class="g2-meal__badge cal"><img src="assets/icons/cal-24-dark.svg" alt="" /></span>') +
          "</button>";
      }).join("");
    }
    document.getElementById("g2Meals").addEventListener("click", function (e) {
      var btn = e.target.closest(".g2-meal");
      if (!btn) return;
      var i = Number(btn.dataset.i);
      var slots = T.slotsFor(T.cur().label);
      if (!slots[i]) { T.openModal(); return; }
      slots[i].done = !slots[i].done;
      T.saveState();
      renderMeals(-1);
      easeActiveRing();
      setMeta(active, false);
      T.drawWeek(T.cur());
      if (slots[i].done) {
        if (T.maybeCelebrate(T.cur().label)) {
          var chart = document.querySelectorAll("#g2Car .plate-chart")[active];
          chart.classList.remove("celebrate"); void chart.offsetWidth;
          chart.classList.add("celebrate");
        } else pulsePlate();
      }
    });

    /* ---- everything under the carousel ---- */
    function renderBelow(animate) {
      var s = T.cur();
      renderMeals(-1);
      T.drawWeek(s);
      document.getElementById("glPlanT").textContent = "Plan meals to hit your " + s.label.toLowerCase() + " goal";
      document.getElementById("glPlanS").textContent = "Health goal: " + s.label;
      document.getElementById("glPlanWrap").style.display = s.label === "Iron" ? "" : "none";
      if (s.label !== "Iron") return;
      var planCard = document.querySelector("#glPlanWrap .ai-card");
      clearTimeout(planCard._t);
      if (animate) {
        planCard.classList.remove("ai-card--reveal");
        planCard.classList.add("ai-card--wait");
        planCard._t = setTimeout(function () {
          planCard.classList.remove("ai-card--wait");
          planCard.classList.add("ai-card--reveal");
        }, 1200);
      } else {
        planCard.classList.remove("ai-card--wait");
        planCard.classList.add("ai-card--reveal");
      }
    }
    function render(animate) {
      renderHero(animate);
      renderBelow(animate);
      document.getElementById("glCount").textContent = T.slides().length;
    }

    T.addAsDone = true;
    T.onAdd = function (free) {
      renderMeals(free);
      easeActiveRing();
      setMeta(active, false);
      T.drawWeek(T.cur());
      pulsePlate();
    };
    T.onMealChange = function () {
      renderMeals(-1);
      easeActiveRing();
      setMeta(active, false);
      T.drawWeek(T.cur());
    };
    T.bindLongPress(document.getElementById("g2Meals"), function (i) { T.openMealSheet(i); });
    T.makeSwipeable(document.getElementById("g2Car"), PITCH, function () { return T.slides().length; });
    /* tapping a peeking plate slides to it */
    document.getElementById("g2Car").addEventListener("click", function (e) {
      var slide = e.target.closest(".g2-slide");
      if (!slide) return;
      var idx = Array.prototype.indexOf.call(this.children, slide);
      if (idx > -1 && idx !== active) this.scrollTo({ left: idx * PITCH, behavior: "smooth" });
    });
    T.onGoalAdded = function (label) {
      render(true);
      setTimeout(function () {
        var idx = T.slides().map(function (x) { return x.label; }).indexOf(label);
        document.getElementById("g2Car").scrollTo({ left: idx * PITCH, behavior: "smooth" });
      }, 350);
    };
    T.bindSheet(render);
    /* the contextual nudge continues the flow: plan the week around the goal */
    document.getElementById("glPlan").addEventListener("click", function () {
      location.href = localStorage.getItem("clovePlanned") ? "plan.html" : "plan.html?ask=1";
    });
    render(true);
  })();
</script>
</body>
</html>
